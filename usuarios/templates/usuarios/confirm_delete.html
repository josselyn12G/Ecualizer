{% extends 'base.html' %}

{% block content %}
<h1>Confirmar eliminación</h1>

<p>¿Estás seguro de que deseas eliminar este registro?</p>

<form method="post">
    {% csrf_token %}
    <button class="btn-danger" type="submit">Sí, eliminar</button>
    <a class="btn-secondary" href="javascript:history.back()">Cancelar</a>
</form>
{% endblock %}
